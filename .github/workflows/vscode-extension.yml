name: VS Code extension

on:
  pull_request:
  push:
    branches: ["main", "dev"]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, test, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: editors/vscode/.nvmrc
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Install locked dependencies
        run: npm --prefix editors/vscode ci

      - name: Validate extension
        run: npm --prefix editors/vscode run check

      - name: Build VSIX
        run: npm --prefix editors/vscode run package:reproducible

      - name: Verify VSIX artifact
        run: test -s dist/bingo.vsix
