name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag at the selected workflow revision (optional prerelease suffix)
        required: true
        type: string
      upload_to_draft:
        description: Attach verified assets to an existing draft release; never publish it
        required: false
        default: false
        type: boolean
  release:
    types: [published]
  workflow_run:
    workflows: ["Go"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag || 'auto' }}
  cancel-in-progress: false

jobs:
  # Automatic path only: pick the next patch version, tag the tested commit,
  # and open a draft release. Skipped for manual and published-release runs.
  prepare:
    name: Pick next version, tag and create draft
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      !contains(github.event.workflow_run.head_commit.message, '[skip release]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      # The build below checks out github.sha (latest main), so only release
      # when the tested commit is still that commit.
      - name: Skip if main already moved on
        id: fresh
        run: |
          live=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$live" != "$HEAD_SHA" || "$GITHUB_SHA" != "$HEAD_SHA" ]]; then
            echo "main moved on; the newer commit will be released instead."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute next patch version
        id: version
        if: steps.fresh.outputs.skip != 'true'
        run: |
          existing=$(git tag --points-at "$HEAD_SHA" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true)
          if [[ -n "$existing" ]]; then
            echo "$HEAD_SHA is already tagged ($existing); nothing to do."
            exit 0
          fi

          latest=$(git tag --list 'v*' --sort=-v:refname \
            | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' | head -1 || true)

          # Docs-only changes since the last release don't need a new version.
          if [[ -n "$latest" ]]; then
            if ! git diff --name-only "$latest" "$HEAD_SHA" \
              | grep -qvE '(^docs/|^\.github/ISSUE_TEMPLATE/|\.md$)'; then
              echo "Only docs changed since $latest; skipping."
              exit 0
            fi
          fi

          if [[ -z "$latest" ]]; then
            next=v0.0.1
          else
            IFS=. read -r major minor patch <<< "${latest#v}"
            next="v$major.$minor.$((patch + 1))"
          fi
          echo "latest=${latest:-none} next=$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"

      - name: Create tag and draft release
        if: steps.version.outputs.tag != ''
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" \
            -f ref="refs/tags/$TAG" -f sha="$HEAD_SHA" >/dev/null
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --title "$TAG" --generate-notes

  resolve:
    needs: prepare
    if: >-
      ${{ !cancelled() && needs.prepare.result != 'failure' &&
      (github.event_name != 'workflow_run' || needs.prepare.outputs.tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate tag before using it as a ref
        id: tag
        env:
          REQUESTED_TAG: ${{ github.event.release.tag_name || inputs.tag || needs.prepare.outputs.tag }}
        run: bash scripts/release-ref.sh "$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
      - name: Require the tag to match the triggering revision
        id: commit
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          commit=$(git rev-parse --verify HEAD)
          [[ "$commit" =~ ^[0-9a-f]{40}$ ]]
          test "$commit" = "$RELEASE_COMMIT"
          tag_commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          if [[ "$tag_commit" != "$RELEASE_COMMIT" ]]; then
            echo "The release tag must match the triggering revision; dispatch with --ref set to that tag." >&2
            exit 1
          fi
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"

  build:
    name: Native assets (${{ matrix.target }})
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: linux-x64
            goos: linux
            goarch: amd64
            uname_os: Linux
            uname_arch: x86_64
            go_tags: ""
          - runner: macos-15
            target: darwin-arm64
            goos: darwin
            goarch: arm64
            uname_os: Darwin
            uname_arch: arm64
            go_tags: bingonative
    env:
      BINGO_VERSION: ${{ needs.resolve.outputs.tag }}
      BINGO_COMMIT: ${{ needs.resolve.outputs.commit }}
      BINGO_VSCODE_TARGET: ${{ matrix.target }}
      GO_TAGS: ${{ matrix.go_tags }}
      EXPECTED_GOOS: ${{ matrix.goos }}
      EXPECTED_GOARCH: ${{ matrix.goarch }}
      EXPECTED_UNAME_OS: ${{ matrix.uname_os }}
      EXPECTED_UNAME_ARCH: ${{ matrix.uname_arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Actions cache authority follows the event ref, not a separately selected tag.
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version-file: editors/vscode/.nvmrc
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Require the exact tag and a native builder
        run: |
          test "$(git rev-parse HEAD)" = "$BINGO_COMMIT"
          test "$(git rev-parse --verify "refs/tags/$BINGO_VERSION^{commit}")" = "$BINGO_COMMIT"
          test "$(uname -s)" = "$EXPECTED_UNAME_OS"
          test "$(uname -m)" = "$EXPECTED_UNAME_ARCH"
          test "$(go env GOHOSTOS)" = "$EXPECTED_GOOS"
          test "$(go env GOHOSTARCH)" = "$EXPECTED_GOARCH"
          bash scripts/preflight.sh release
      - name: Verify Go source and tooling
        run: |
          go mod tidy -diff
          go vet -tags "$GO_TAGS" ./...
          go test -tags "$GO_TAGS" ./...
      - name: Restore locked extension dependencies
        run: npm --prefix editors/vscode ci --ignore-scripts
      - name: Verify extension source
        run: npm --prefix editors/vscode run check
      - name: Build reproducible binaries, VSIX, companion and checksums
        run: go run ./scripts/release -version "$BINGO_VERSION"
      - name: Smoke packaged server health and idle exit (no native debug claim)
        run: npm --prefix editors/vscode run smoke:server
      - name: Ensure packaging left source unchanged
        run: test -z "$(git status --porcelain --untracked-files=normal)"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/release/*
          if-no-files-found: error
          retention-days: 14

  upload:
    name: Attach verified assets (never publish a draft)
    needs: [prepare, resolve, build]
    if: >-
      ${{ !cancelled() && needs.resolve.result == 'success' && needs.build.result == 'success' &&
      (github.event_name == 'release' || inputs.upload_to_draft || needs.prepare.outputs.tag != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Recheck tag, release state and exact checksums before upload
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
          RELEASE_EVENT: ${{ github.event_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          [[ "${#RELEASE_TAG}" -le 80 ]]
          [[ "$RELEASE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          tag_commit() {
            object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq '[.object.type, .object.sha] | @tsv') || return 1
            for depth in 1 2 3 4 5 6 7 8; do
              read -r object_type object_sha extra <<< "$object" || return 1
              [[ "$object_sha" =~ ^[0-9a-f]{40}$ && -z "$extra" ]] ||
                { echo "Malformed release tag object." >&2; return 1; }
              case "$object_type" in
                commit) printf '%s\n' "$object_sha"; return ;;
                tag) object=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$object_sha" --jq '[.object.type, .object.sha] | @tsv') || return 1 ;;
                *) echo "Release ref does not resolve to a commit." >&2; return 1 ;;
              esac
            done
            echo "Release tag nesting exceeds the supported bound." >&2
            return 1
          }
          check_release() {
            test "$(tag_commit)" = "$RELEASE_COMMIT"
            draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
            # Only a human-published release is already public; every other path uploads to a draft.
            if [[ "$RELEASE_EVENT" == release ]]; then
              test "$draft" = false || { echo "Published-release uploads require a published release." >&2; exit 1; }
            else
              test "$draft" = true || { echo "Draft uploads require an existing draft release." >&2; exit 1; }
            fi
          }
          check_release
          cd release-assets
          assets=()
          for platform in linux_amd64 darwin_arm64; do
            if [[ "$platform" == linux_amd64 ]]; then target=linux-x64; else target=darwin-arm64; fi
            base="bingo_${RELEASE_TAG}_${platform}"
            sums="${base}_SHA256SUMS.txt"
            expected=("${base}.tar.gz" "bingo-neovim_${RELEASE_TAG}_${platform}.tar.gz" "bingo-${RELEASE_TAG}-${target}.vsix" "${base}.json")
            printf '%s\n' "${expected[@]}" | LC_ALL=C sort > expected.txt
            awk 'length($1) != 64 || $1 ~ /[^0-9a-f]/ || NF != 2 { exit 1 } { print $2 }' "$sums" | LC_ALL=C sort > actual.txt
            diff -u expected.txt actual.txt
            shasum -a 256 -c "$sums"
            assets+=("${expected[@]}" "$sums")
          done
          check_release
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber "${assets[@]}"

  # Automatic path only: the draft becomes public once verified assets are attached.
  publish:
    name: Publish release after verified upload
    needs: [prepare, resolve, upload]
    if: ${{ needs.upload.result == 'success' && needs.prepare.outputs.tag != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          [[ "$draft" == true ]]
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

  # Automatic path only: a failed build leaves no draft or tag behind, so the
  # next green commit reuses the same version number.
  cleanup:
    name: Remove unreleased draft and tag after a failed run
    needs: [prepare, resolve, build, upload, publish]
    if: >-
      ${{ always() && needs.prepare.outputs.tag != '' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete the draft release and its tag (never a published one)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Refusing to clean up '$RELEASE_TAG'." >&2; exit 1; }
          draft=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [[ "$draft" == true ]]; then
            gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            echo "Deleted draft and tag $RELEASE_TAG."
          elif [[ "$draft" == missing ]]; then
            # Tag was created but the draft never was.
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" || true
            echo "Removed orphan tag $RELEASE_TAG."
          else
            echo "Release is already published; leaving it alone."
          fi