name: Linux stop TID race proof

# Proof-only workflow for the lastStopTID ownership audit. The focused tests
# exercise production linuxBackend accessors; the unfixed branch is expected to
# fail under -race, while the stopped-state control must remain green.

on:
  workflow_dispatch:
    inputs:
      expect_race:
        description: "Whether the running-state probe should report a race"
        required: true
        default: true
        type: boolean
  push:
    branches:
      - "xsachax-audit-linux-stop-tid-race"

permissions:
  contents: read

jobs:
  proof:
    name: Native linux/amd64 race discriminator
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.5"

      - name: Confirm native target
        run: test "$(go env GOOS)/$(go env GOARCH)" = "linux/amd64"

      - name: Stopped-state control
        run: >
          go test -race -count=1 -v ./internal/debugger
          -run '^TestLinuxBackendStoppedMemoryStopTIDOrdered$'

      - name: Running-state production race probe
        id: race_probe
        continue-on-error: true
        run: >
          go test -race -count=1 -v ./internal/debugger
          -run '^TestLinuxBackendRunning(Kill|Memory)StopTIDRace$'

      - name: Verdict
        env:
          OUTCOME: ${{ steps.race_probe.outcome }}
          EXPECT_RACE: ${{ github.event_name == 'push' && 'true' || inputs.expect_race }}
        run: |
          if [ "$EXPECT_RACE" = "true" ] && [ "$OUTCOME" = "failure" ]; then
            echo "::notice::race deterministically reproduced; stopped-state control passed"
            exit 0
          fi
          if [ "$EXPECT_RACE" = "false" ] && [ "$OUTCOME" = "success" ]; then
            echo "::notice::race absent after the fix; stopped-state control passed"
            exit 0
          fi
          echo "::error::unexpected race-probe outcome: expected_race=$EXPECT_RACE outcome=$OUTCOME"
          exit 1
